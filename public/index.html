<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Inventario &amp; Empaque</title>
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ============ HEADER ============ -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold flex items-center gap-2">
        📦 <span>Inventario &amp; Empaque</span>
      </h1>
      <span id="conn-status" class="text-xs px-2 py-1 rounded-full bg-emerald-600">conectado</span>
    </div>
  </header>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main class="pb-24 max-w-2xl mx-auto">

    <!-- MODULO A: Carga masiva y vinculo de codigo de barras -->
    <section id="view-carga" class="view p-4 space-y-4"></section>

    <!-- MODULO B: Inventario y busqueda rapida -->
    <section id="view-inventario" class="view p-4 space-y-4 hidden"></section>

    <!-- MODULO C: Checking / Empaque de pedidos -->
    <section id="view-empaque" class="view p-4 space-y-4 hidden"></section>

  </main>

  <!-- ============ TOAST GLOBAL ============ -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[90%]"></div>

  <!-- ============ NAV INFERIOR (mobile-first) ============ -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.06)] z-40">
    <div class="max-w-2xl mx-auto grid grid-cols-3">
      <button data-tab="carga" class="tab-btn flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">📥</span><span class="text-xs font-medium">Carga</span>
      </button>
      <button data-tab="inventario" class="tab-btn flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">🔍</span><span class="text-xs font-medium">Inventario</span>
      </button>
      <button data-tab="empaque" class="tab-btn flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">✅</span><span class="text-xs font-medium">Empaque</span>
      </button>
    </div>
  </nav>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/utils.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/modulo-carga.js"></script>
  <script src="js/modulo-inventario.js"></script>
  <script src="js/modulo-empaque.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

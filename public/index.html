<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Inventario &amp; Empaque</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ============ HEADER ============ -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="px-4 py-2.5 flex items-center justify-between flex-wrap gap-2 max-w-[1700px] mx-auto">
      <div class="flex items-center gap-2">
        <h1 class="text-base sm:text-lg font-bold flex items-center gap-1.5">
          📦 <span>Jispiplast Express</span>
        </h1>
        <span id="conn-status" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-600 font-medium">online</span>
      </div>
      <div id="header-user-badge" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main class="pb-24 w-full max-w-[1700px] mx-auto px-2 sm:px-4 md:px-6">

    <!-- MODULO A: Carga masiva y vinculo de codigo de barras -->
    <section id="view-carga" class="view p-4 space-y-4"></section>

    <!-- MODULO B: Inventario y busqueda rapida -->
    <section id="view-inventario" class="view p-4 space-y-4 hidden"></section>

    <!-- MODULO C: Checking / Empaque de pedidos -->
    <section id="view-empaque" class="view p-4 space-y-4 hidden"></section>

    <!-- MODULO D: Domicilios & Liquidacion -->
    <section id="view-domicilios" class="view p-4 space-y-4 hidden"></section>

  </main>

  <!-- ============ TOAST GLOBAL ============ -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[90%]"></div>

  <!-- ============ NAV INFERIOR (mobile-first) ============ -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.06)] z-40">
    <div id="nav-tabs-container" class="max-w-4xl mx-auto flex items-center justify-around">
      <button data-tab="carga" class="tab-btn flex-1 flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">📥</span><span class="text-xs font-medium">Carga</span>
      </button>
      <button data-tab="inventario" class="tab-btn flex-1 flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">🔍</span><span class="text-xs font-medium">Inventario</span>
      </button>
      <button data-tab="empaque" class="tab-btn flex-1 flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">✅</span><span class="text-xs font-medium">Empaque</span>
      </button>
      <button data-tab="domicilios" class="tab-btn flex-1 flex flex-col items-center py-3 gap-1 text-slate-500">
        <span class="text-xl">🚚</span><span class="text-xs font-medium">Domicilios</span>
      </button>
      <button id="nav-btn-usuarios" onclick="Auth.abrirModalUsuarios()" class="flex-1 flex flex-col items-center py-3 gap-1 text-slate-500 hidden hover:text-indigo-600 transition-colors">
        <span class="text-xl">👥</span><span class="text-xs font-medium">Usuarios</span>
      </button>
    </div>
  </nav>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/utils.js?v=1.2"></script>
  <script src="js/auth.js?v=1.6"></script>
  <script src="js/sound.js?v=1.2"></script>
  <script src="js/scanner.js?v=1.2"></script>
  <script src="js/recortador.js?v=1.2"></script>
  <script src="js/modulo-carga.js?v=1.4"></script>
  <script src="js/modulo-inventario.js?v=1.4"></script>
  <script src="js/modulo-empaque.js?v=1.4"></script>
  <script src="js/modulo-domicilios.js?v=1.6"></script>
  <script src="js/app.js?v=1.4"></script>
</body>
</html>
